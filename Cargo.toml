[package]
name = "air-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Keyboard-first desktop client for the Air messenger, built with GPUI"
publish = false

[dependencies]
# UI: gpui-kit pins the matching gpui-pre snapshot; never mix in other gpui lineages.
gpui-kit = "=0.9.0"

# Air core, pinned to one upstream commit. Bump all three together.
aircoreclient = { git = "https://github.com/phnx-im/air", rev = "fcac222a41010c56fba102d4554ec01c86e79311" }
aircommon = { git = "https://github.com/phnx-im/air", rev = "fcac222a41010c56fba102d4554ec01c86e79311" }
airapiclient = { git = "https://github.com/phnx-im/air", rev = "fcac222a41010c56fba102d4554ec01c86e79311" }

# Message content types, at the rev Air pins.
mimi_content = { git = "https://github.com/phnx-im/mimi-content", rev = "9690d8f28a5470695b9fb715e284d7ea59d97fc0" }

anyhow = "1"
# Room policy, for who may remove whom in a group (at the rev Air pins).
mimi-room-policy = { git = "https://github.com/phnx-im/mimi-room-policy", rev = "603f3e07372119560ce9d60252e5df2f6cbd1e18" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
futures-util = "0.3"
# Attachment previews (WebP) are decoded here, under explicit limits, into
# the frames gpui draws: gpui's own decoding has none. Same copy as gpui's.
image = { version = "0.25", default-features = false, features = ["webp"] }
# Air's markdown flavour; previews are flattened from it.
pulldown-cmark = { version = "0.13", default-features = false }
# Must match gpui's schemars major: the Action derive implements its trait.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Room policy ids are TLS-serialized user ids.
tls_codec = "0.5"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
# Link targets are normalized (punycode hosts, escaped paths) before shown.
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications over D-Bus. Same major and backend (async-io) as
# gpui's own zbus, so no second copy or runtime is pulled in.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
# gpui-kit's own `test-support` feature drags in the gpui-fast backend, whose
# pins conflict; enable test support on the underlying gpui-pre crates instead.
gpui-pre = { version = "=0.3.11", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.11", features = ["test-support"] }
tempfile = "3"

# Mirrors the [patch] sections of the pinned Air workspace (patches do not
# propagate to dependents). Keep in sync when bumping the Air rev.
[patch.crates-io]
ml-dsa = { git = "https://github.com/RustCrypto/signatures", rev = "017ce322cdbdd66a702cc0c4ef676b38022e5cbb" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "7c94cc351ea771771100edca47695055da379a34" }

[patch."https://github.com/openmls/openmls"]
openmls_sqlite_storage = "=0.3.0"

# Hot crypto/SQLite paths, as in Air's workspace.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.voprf-ng]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
